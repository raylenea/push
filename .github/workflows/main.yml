<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat cafee</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fffaf5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            background-color: #f8e5e5;
            border-style: groove;
            
        }

        .navbar-brand {
            color: #e1b568;
            font-size: 28px;
            font-weight: bold;
            border-style: groove;
        }

        .hero {
            background-color: #ecbd9f;
            padding: 80px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 55px;
            color: #8b6f50;
        }

        .hero p {
            font-size: 19px;
        }

        .btn-pink {
            background-color: #c9b387;
            color: rgb(255, 255, 255);
        }

        .btn-pink:hover {
            background-color: #b79658;
            color: rgb(255, 255, 255);
        }

        .section-title {
            color: #e0ab72;
            text-align: center;
            margin: 40px 0;
        }

        .card img {
            height: 220px;
            object-fit: cover;
        }

        footer {
            background-color: #ecbe75;
            color: #75684c;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="#">Cat cafee</a>

        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#coffee">coffee</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>

        </div>
    </div>
</nav>


<!-- HOME SECTION -->
<section class="hero" id="home">

    <h1>Cat cafe</h1>

    <p>Cuteness over loaded</p>

    <p>Spend you day with cuteness and awesome drinks</p>

    <a href="#collection" class="btn btn-pink mt-3">Explore drinks</a>

</section>


<!-- ABOUT SECTION -->
<section class="container my-5" id="about">

    <h2 class="section-title">About Cat Cafe</h2>

    <p class="text-center">
        Welcome to the Cat Cafe ! we take care of cats
       and proivde you with awesome drinks and sweets!
       A purrfect way to start your day with delicious smell </p>

</section>


<!-- COLLECTION SECTION -->
<section class="container my-5" id="collection">

    <h2 class="section-title">Our kitties</h2>

    <div class="row">

        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://images.pexels.com/photos/1870376/pexels-photo-1870376.jpeg?cs=srgb&dl=pexels-larissa-barbosa-945746-1870376.jpg&fm=jpg">
                <div class="card-body text-center">
                    <h5>cutest kitties</h5>
                    <p>purrfect start to your day!</p>
                    <button class="btn btn-pink">Explore</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://cdn.pixabay.com/photo/2024/02/28/07/42/european-shorthair-8601492_1280.jpg">
                <div class="card-body text-center">
                    <h5>furry cats</h5>
                    <p>Kittiess.</p>
                    <button class="btn btn-pink">Explore</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://tse4.mm.bing.net/th/id/OIP.7k7Q42rxsErczekyedFYxwAAAA?r=0&w=450&h=299&rs=1&pid=ImgDetMain&o=7&rm=3">
                <div class="card-body text-center">
                    <h5>complete cuties</h5>
                    <p>awesome drinks</p>
                    <button class="btn btn-pink">Explore</button>
                </div>
            </div>
        </div>

    </div>

</section>


<!-- CONTACT SECTION -->
<section class="container my-5 text-center" id="contact">

    <h2 class="section-title">Contact Us</h2>

    <p>Email: cutekitty@gmail.com</p>
    <p>Instagram: @cutnes_kitty</p>

    <button class="btn btn-pink">Contact Us!</button>

</section>


<!-- FOOTER -->
<footer>
    <p>© Cat Cafe. All Rights Reserved.</p>
    <p>Cuteness overloaded.</p>
</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
